<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenyérsütő Asszisztens</title>

    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

<div class="container">

    <!-- KÖVETKEZŐ TEENDŐ -->

    <section class="next-task card">

        <h1>🔔 Következő teendő</h1>

        <div class="next-bread">
            🍞 Kenyér #2
        </div>

        <div class="next-process">
            Hajtogatás 1 + Pihentetés 2
        </div>

        <div class="countdown" id="mainCountdown">
            00:02:17
        </div>

<div class="task-buttons">

    <button id="startBtn">
        ▶ START
    </button>

    <button id="completeTaskBtn">
        ✅ Kész
    </button>

</div>
    </section>


    <!-- FELSŐ SOR -->

    <section class="bread-grid">

        <!-- Kenyér #1 -->

        <article class="bread-card active-bread" id="bread1">

            <div class="bread-header">

                <h2>🍞 Kenyér #1</h2>

                <div class="finish-time">
                    🏁 00:12
                </div>

            </div>

            <div class="image-wrapper">

                <img
                    id="bread1Image"
                    class="bread-image"
                    src="Hajtogatas_1.png"
                    alt="Kenyér #1">

            </div>

            <div class="process-title">
                Kivétel fazékból + Sütés rácson
            </div>

            <div class="remaining-time">
                ⏳ 8 perc
            </div>

            <div class="progress">
                <div class="progress-bar" style="width:90%"></div>
            </div>

            <div class="workflow"></div>
<button class="reset-btn">
    🔄 Reset
</button>
        </article>

        <!-- SÜTŐ PANEL -->

<article class="oven-panel card">

    <h2>🔥 Sütő</h2>

<div class="oven-row">
    <strong>Állapot:</strong>
    <span id="ovenStatus">Szabad</span>
</div>
            <div class="oven-row">
                <strong>Sütés kezdete:</strong>
                <span id="ovenNextTime">-</span>
            </div>

        </article>

    <!-- ALSÓ SOR -->

    <section class="bottom-grid">


        <!-- Kenyér #2 -->

        <article class="bread-card" id="bread2">

            <div class="bread-header">

                <h2>🍞 Kenyér #2</h2>

                <div class="finish-time">
                    🏁 01:24
                </div>

            </div>

            <div class="image-wrapper">

                <img
                    id="bread2Image"
                    class="bread-image"
                    src="Hajtogatas_4.png"
                    alt="Kenyér #2">

            </div>

            <div class="process-title">
                Hajtogatás 1 + Pihentetés 2
            </div>

            <div class="remaining-time">
                ⏳ 2 perc
            </div>

            <div class="progress">
                <div class="progress-bar" style="width:35%"></div>
            </div>

            <div class="workflow">

                <div class="done"></div>
                <div class="done"></div>
                <div class="done"></div>
                <div class="done"></div>
                <div class="done"></div>
                <div class="current"></div>
                <div></div>

            </div>
<button class="reset-btn">
    🔄 Reset
</button>
        </article>

        <!-- Kenyér #3 -->

        <article class="bread-card waiting-card" id="bread3">

            <div class="bread-header">

                <h2>🍞 Kenyér #3</h2>

                <div class="finish-time">
                    🏁 --:--
                </div>

            </div>

<div class="image-wrapper">

    <img
        id="bread3Image"
        class="bread-image"
        src="Hajtogatas_7.png"
        alt="Kenyér #3">

</div>

<div class="process-title">
    Még nem indult
</div>

<div class="remaining-time"></div>

<div class="progress">
    <div class="progress-bar"></div>
</div>

<div class="workflow"></div>
<button class="reset-btn">
    🔄 Reset
</button>
</article>
    </section>
</div>

<script src="app.js"></script>

</body>
</html>
